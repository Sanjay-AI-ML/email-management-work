name: Verify Maildesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test on Linux
        if: runner.os != 'Windows'
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: maildesk-${{ runner.os }}
          path: target/maildesk.jar
          if-no-files-found: error
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -NoBuild -JdkPath $env:JAVA_HOME
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = Start-Process -FilePath (Resolve-Path 'package/Maildesk/Maildesk.exe') -ArgumentList '--help' -WindowStyle Hidden -Wait -PassThru
          if ($launcher.ExitCode -ne 0) { throw 'The packaged Windows launcher failed.' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Maildesk-Windows-x64
          path: package/Maildesk-Windows-x64.zip
          if-no-files-found: error
